name: Shellcheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck on all shell scripts
        run: |
          find . -name "*.sh" -not -path "./node_modules/*" -print0 \
            | xargs -0 shellcheck
